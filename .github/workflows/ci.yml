name: CI

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Install shfmt
        run: |
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.7.0/shfmt_v3.7.0_linux_amd64 -o /tmp/shfmt
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
      - name: Install bashate
        run: |
          pip install --user bashate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate plugin.toml exists and is non-empty
        run: test -s plugin.toml && head -5 plugin.toml
      - name: Run shellcheck
        run: make shellcheck
      - name: Check shfmt
        run: make shfmt
      - name: Run bashate
        run: make bashate

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core (>=1.5)
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version
      - run: bats tests/unit_helpers.bats

  integration-tests:
    name: integration-tests-${{ matrix.dokku-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dokku-version: ["0.35.20", "0.36.4", "0.37.10", "0.38.27"]
    env:
      DOKKU_TAG: ${{ matrix.dokku-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Increase max_map_count for Dokku
        run: sudo sysctl -w vm.max_map_count=262144 || true
      - name: Bring up Dokku in Docker
        run: ./tests/setup-dokku.sh
      - name: Install bats inside Dokku container
        run: docker exec dokku-generic-test bash -c 'apt-get update -qq && apt-get install -y -qq bats'
      - name: Run bats integration tests
        run: |
          docker exec dokku-generic-test bash -c '
            bats /var/lib/dokku/plugins/available/generic/tests/service_*.bats /var/lib/dokku/plugins/available/generic/tests/hook_*.bats /var/lib/dokku/plugins/available/generic/tests/link_networks.bats
          '
      - name: Tear down Dokku
        if: always()
        run: ./tests/teardown-dokku.sh
